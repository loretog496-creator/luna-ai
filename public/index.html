<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luna AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #212121;
    color: white;
    height: 100vh;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    height: 60px;
    border-bottom: 1px solid #3a3a3a;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 20px;
    font-weight: bold;
}

.logo {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
}

.status {
    font-size: 12px;
    color: #888;
    margin-left: 10px;
    font-weight: normal;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px 15px 120px;
}

.container {
    max-width: 800px;
    margin: auto;
}

.message {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    line-height: 1.6;
}

.avatar {
    min-width: 35px;
    height: 35px;
    border-radius: 50%;
    background: #8b5cf6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.user .avatar {
    background: #444;
}

.text {
    white-space: pre-wrap;
    padding-top: 5px;
}

.welcome {
    text-align: center;
    margin-top: 20vh;
}

.welcome h1 {
    font-size: 32px;
}

.welcome p {
    color: #999;
}

.composer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 15px;
    background: linear-gradient(transparent, #212121 30%);
}

form {
    max-width: 800px;
    margin: auto;
    background: #303030;
    border: 1px solid #444;
    border-radius: 16px;
    display: flex;
    padding: 8px;
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    padding: 10px;
    font-size: 16px;
    font-family: Arial, sans-serif;
}

button {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    font-size: 20px;
    cursor: pointer;
}

button:hover {
    background: #ddd;
}

@media(max-width:600px) {

    header {
        height: 55px;
        font-size: 18px;
    }

    .welcome h1 {
        font-size: 26px;
    }

}

</style>

</head>

<body>

<div class="app">

<header>

<div class="logo">
L
</div>

Luna

<div class="status">
IA online
</div>

</header>

<div id="chat">

<div class="container" id="messages">

<div class="welcome">

<h1>Como posso ajudar?</h1>

<p>
Eu sou a Luna, sua inteligência artificial.
</p>

</div>

</div>

</div>

<div class="composer">

<form id="form">

<textarea
id="input"
rows="1"
placeholder="Mensagem para Luna..."
></textarea>

<button type="submit">
↑
</button>

</form>

</div>

</div>

<script>

const form = document.getElementById("form");

const input = document.getElementById("input");

const messages = document.getElementById("messages");


function addMessage(type, text) {

    const message = document.createElement("div");

    message.className = "message " + type;

    const avatar = document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        type === "user" ? "Você" : "L";

    const content = document.createElement("div");

    content.className = "text";

    content.textContent = text;

    message.appendChild(avatar);

    message.appendChild(content);

    messages.appendChild(message);

    document.getElementById("chat").scrollTop =
        document.getElementById("chat").scrollHeight;

}


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const message = input.value.trim();

    if (!message) return;

    addMessage("user", message);

    input.value = "";

    addMessage("assistant", "Pensando...");

    const thinking =
        messages.lastElementChild.querySelector(".text");

    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        thinking.textContent =
            data.answer || data.error;

    }

    catch (error) {

        thinking.textContent =
            "Não consegui conectar com a Luna.";

    }

});


input.addEventListener("keydown", function(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        form.requestSubmit();

    }

});

</script>

</body>
  </html>
